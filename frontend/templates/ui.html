<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f9fc; }
        .sms-cell { max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-shadow { box-shadow: 0 0.15rem 1rem rgba(0,0,0,.08); }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">SMS 历史记录</h1>
        <div class="d-flex gap-2">
            <button id="refreshBtn" class="btn btn-primary btn-sm">刷新</button>
            <button id="showDownloadModalBtn" class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#apkDownloadModal">下载 SmsForwarder</button>
            <a href="/sms/healthz" target="_blank" class="btn btn-outline-secondary btn-sm">健康检查</a>
        </div>
    </div>
    <div class="card card-shadow mb-3">
        <div class="card-body py-3">
            <label for="reportKeyInput" class="form-label mb-2">查询 Key（存储在浏览器 localStorage）</label>
            <div class="input-group input-group-sm">
                <input id="reportKeyInput" type="password" class="form-control" placeholder="请输入 REPORT_AUTH_KEY 或轮换 key">
                <button id="saveKeyBtn" class="btn btn-outline-primary" type="button">保存</button>
                <button id="clearKeyBtn" class="btn btn-outline-secondary" type="button">清空</button>
            </div>
            <div id="keyStatus" class="form-text mt-2 text-muted">未设置 key，将无法查询历史。</div>
        </div>
    </div>
    <div class="card card-shadow mb-3">
        <div class="card-body py-3">
            <div class="fw-semibold mb-2">已拼接 key 的 webhook 地址</div>
            <div class="input-group input-group-sm mb-2">
                <input id="webhookUrlInput" type="text" class="form-control" readonly>
                <button id="copyWebhookBtn" class="btn btn-outline-primary" type="button">复制</button>
            </div>
            <div class="input-group input-group-sm">
                <input id="legacyWebhookUrlInput" type="text" class="form-control" readonly>
                <button id="copyLegacyWebhookBtn" class="btn btn-outline-primary" type="button">复制兼容地址</button>
            </div>
            <div class="form-text mt-2 text-muted">若第三方只支持 URL 形式，可使用以上地址（参数名：report_key）。</div>
        </div>
    </div>
    <div class="card card-shadow">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th style="width: 140px;">发送方</th>
                        <th>短信内容</th>
                        <th style="width: 120px;">验证码</th>
                        <th style="width: 180px;">接收时间</th>
                    </tr>
                    </thead>
                    <tbody id="historyBody">
                    <tr>
                        <td colspan="5" class="text-center text-muted py-4">加载中...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <div id="pageInfo" class="text-muted small"></div>
        <div class="btn-group">
            <button id="prevBtn" class="btn btn-outline-secondary btn-sm">上一页</button>
            <button id="nextBtn" class="btn btn-outline-secondary btn-sm">下一页</button>
        </div>
    </div>
</div>

<div class="modal fade" id="apkDownloadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">下载 SmsForwarder</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="input-group input-group-sm mb-3">
                    <input id="apkDownloadUrlInput" type="text" class="form-control" readonly>
                    <button id="copyApkUrlBtn" class="btn btn-outline-primary" type="button">复制下载地址</button>
                </div>
                <div class="text-center">
                    <div id="apkQrCodeBox" style="width:220px;height:220px;margin:0 auto;"></div>
                </div>
                <div id="apkQrStatus" class="small text-danger text-center mt-2 d-none"></div>
                <div class="small text-muted text-center mt-2">手机扫码即可下载 APK</div>
            </div>
            <div class="modal-footer">
                <a id="apkDownloadLink" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-success btn-sm">打开下载链接</a>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/sms/assets/qrcode.min.js"></script>
<script>
(() => {
    const reportKeyStorageKey = "sms_report_auth_key";
    const apkFileName = "SmsF_3.5.0.260224_100055_universal_release.apk";
    const limit = 20;
    let currentPage = 1;
    let hasMore = false;

    const historyBody = document.getElementById("historyBody");
    const pageInfo = document.getElementById("pageInfo");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const reportKeyInput = document.getElementById("reportKeyInput");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const clearKeyBtn = document.getElementById("clearKeyBtn");
    const keyStatus = document.getElementById("keyStatus");
    const webhookUrlInput = document.getElementById("webhookUrlInput");
    const legacyWebhookUrlInput = document.getElementById("legacyWebhookUrlInput");
    const copyWebhookBtn = document.getElementById("copyWebhookBtn");
    const copyLegacyWebhookBtn = document.getElementById("copyLegacyWebhookBtn");
    const showDownloadModalBtn = document.getElementById("showDownloadModalBtn");
    const apkDownloadUrlInput = document.getElementById("apkDownloadUrlInput");
    const copyApkUrlBtn = document.getElementById("copyApkUrlBtn");
    const apkDownloadLink = document.getElementById("apkDownloadLink");
    const apkQrCodeBox = document.getElementById("apkQrCodeBox");
    const apkQrStatus = document.getElementById("apkQrStatus");

    const esc = (v) => String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    const fmtTime = (value) => {
        if (!value) return "-";
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return esc(value);
        return d.toLocaleString("zh-CN", { hour12: false });
    };

    const getReportKey = () => (reportKeyInput?.value || "").trim();

    const updateKeyStatus = () => {
        const key = getReportKey();
        if (!key) {
            keyStatus.textContent = "未设置 key，将无法查询历史。";
            keyStatus.className = "form-text mt-2 text-muted";
            return;
        }
        keyStatus.textContent = "key 已设置，可刷新查询历史。";
        keyStatus.className = "form-text mt-2 text-success";
    };

    const buildWebhookUrl = (path, key) => {
        const base = `${window.location.origin}${path}`;
        if (!key) return base;
        return `${base}?report_key=${encodeURIComponent(key)}`;
    };

    const updateWebhookUrls = () => {
        const key = getReportKey();
        webhookUrlInput.value = buildWebhookUrl("/sms/webhook", key);
        legacyWebhookUrlInput.value = buildWebhookUrl("/v1/sms/receive", key);
    };

    const getApkDownloadUrl = () => `${window.location.origin}/downloads/${encodeURIComponent(apkFileName)}`;

    const updateApkDownload = () => {
        const apkUrl = getApkDownloadUrl();
        apkDownloadUrlInput.value = apkUrl;
        apkDownloadLink.href = apkUrl;
        const showQrError = (message) => {
            if (!apkQrStatus) return;
            apkQrStatus.textContent = message;
            apkQrStatus.classList.remove("d-none");
        };

        if (apkQrStatus) {
            apkQrStatus.textContent = "";
            apkQrStatus.classList.add("d-none");
        }

        if (!apkQrCodeBox) return;

        if (window.QRCode) {
            try {
                apkQrCodeBox.innerHTML = "";
                new window.QRCode(apkQrCodeBox, {
                    text: apkUrl,
                    width: 220,
                    height: 220,
                    correctLevel: window.QRCode.CorrectLevel ? window.QRCode.CorrectLevel.M : undefined
                });
            } catch {
                showQrError("二维码生成失败，请复制下载地址。");
            }
            return;
        }

        showQrError("二维码组件未加载，请刷新页面后重试。");
    };

    const copyText = async (text, successMessage = "已复制") => {
        if (!text) return;
        try {
            await navigator.clipboard.writeText(text);
            keyStatus.textContent = successMessage;
            keyStatus.className = "form-text mt-2 text-success";
        } catch {
            keyStatus.textContent = "复制失败，请手动复制。";
            keyStatus.className = "form-text mt-2 text-danger";
        }
    };

    const renderRows = (items) => {
        if (!Array.isArray(items) || items.length === 0) {
            historyBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">暂无数据</td></tr>';
            return;
        }

        historyBody.innerHTML = items.map((item) => {
            const sms = esc(item.sms || "");
            const from = esc(item.from || "-");
            const code = esc(item.extracted_code || "-");
            const receiveTime = fmtTime(item.receive_time);
            return `
                <tr>
                    <td>${item.id ?? "-"}</td>
                    <td>${from}</td>
                    <td class="sms-cell" title="${sms}">${sms}</td>
                    <td><span class="badge text-bg-info">${code}</span></td>
                    <td>${receiveTime}</td>
                </tr>`;
        }).join("");
    };

    const loadHistory = async (page) => {
        currentPage = page;
        historyBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">加载中...</td></tr>';
        const key = getReportKey();
        if (!key) {
            historyBody.innerHTML = '<tr><td colspan="5" class="text-center text-warning py-4">请先输入并保存查询 key。</td></tr>';
            pageInfo.textContent = "未设置 key";
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = true;
            return;
        }

        try {
            const res = await fetch(`/sms/history?limit=${limit}&page=${page}`, {
                method: "GET",
                headers: {
                    "X-Report-Key": key
                }
            });
            if (res.status === 401) {
                throw new Error("鉴权失败，请检查 key 是否正确");
            }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const payload = await res.json();
            const data = payload?.data || {};
            const items = Array.isArray(data.items) ? data.items : [];

            hasMore = items.length >= limit;
            renderRows(items);
            pageInfo.textContent = `第 ${currentPage} 页 · 每页 ${limit} 条`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = !hasMore;
        } catch (err) {
            historyBody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">加载失败：${esc(err.message || err)}</td></tr>`;
            pageInfo.textContent = "加载失败";
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = true;
        }
    };

    prevBtn.addEventListener("click", () => {
        if (currentPage > 1) loadHistory(currentPage - 1);
    });
    nextBtn.addEventListener("click", () => {
        if (hasMore) loadHistory(currentPage + 1);
    });
    refreshBtn.addEventListener("click", () => loadHistory(currentPage));
    reportKeyInput.addEventListener("input", updateWebhookUrls);
    copyWebhookBtn.addEventListener("click", () => copyText(webhookUrlInput.value, "已复制 webhook 地址。"));
    copyLegacyWebhookBtn.addEventListener("click", () => copyText(legacyWebhookUrlInput.value, "已复制兼容 webhook 地址。"));
    copyApkUrlBtn.addEventListener("click", () => copyText(apkDownloadUrlInput.value, "已复制下载地址。"));
    showDownloadModalBtn.addEventListener("click", (e) => {
        updateApkDownload();
        if (window.bootstrap && bootstrap.Modal) {
            const modalElement = document.getElementById("apkDownloadModal");
            const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
            modal.show();
            e.preventDefault();
        }
    });

    saveKeyBtn.addEventListener("click", () => {
        const key = getReportKey();
        if (key) {
            localStorage.setItem(reportKeyStorageKey, key);
            updateKeyStatus();
            updateWebhookUrls();
            loadHistory(1);
            return;
        }
        localStorage.removeItem(reportKeyStorageKey);
        updateKeyStatus();
        updateWebhookUrls();
        loadHistory(1);
    });

    clearKeyBtn.addEventListener("click", () => {
        reportKeyInput.value = "";
        localStorage.removeItem(reportKeyStorageKey);
        updateKeyStatus();
        updateWebhookUrls();
        loadHistory(1);
    });

    const storedKey = localStorage.getItem(reportKeyStorageKey);
    if (storedKey) {
        reportKeyInput.value = storedKey;
    }
    updateKeyStatus();
    updateWebhookUrls();
    updateApkDownload();
    loadHistory(1);
})();
</script>
</body>
</html>
